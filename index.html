<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fact Check</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<style>
  :root {
    --bg:#15171b; --box:#1e2125; --tx:#dbdee3; --tx2:rgba(219,222,227,.65); --tx3:rgba(219,222,227,.5);
    --ln:rgba(219,222,227,.07); --ln2:rgba(219,222,227,.14); --sf:rgba(219,222,227,.03); --sf2:rgba(219,222,227,.07);
    --teal:#016a71; --red:#ff6b6b;
    --font:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,-apple-system,sans-serif;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--tx); font:370 16px/1.5 var(--font); -webkit-font-smoothing:antialiased; }
  button { font:inherit; color:inherit; cursor:pointer; background:none; border:0; padding:0; }
  button:focus-visible, a:focus-visible, textarea:focus-visible, input:focus-visible { outline:2px solid rgba(32,160,168,.8); outline-offset:2px; }
  a { color:inherit; }
  svg { flex:none; }
  .ic { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }

  .app { display:flex; height:100vh; }

  /* ---------- 사이드바 ---------- */
  #side { width:240px; flex:none; display:flex; flex-direction:column; padding:8px; border-right:1px solid var(--ln);
          background:linear-gradient(var(--sf),var(--sf)),var(--bg); transition:transform .2s; }
  .side-top { display:flex; align-items:center; justify-content:space-between; height:44px; padding:0 4px 0 8px; margin-bottom:4px; }
  .brand { display:flex; align-items:center; gap:8px; font-size:15px; font-weight:600; letter-spacing:-.01em; }
  .brand svg { width:22px; height:22px; }
  .row { display:flex; align-items:center; gap:10px; width:100%; height:40px; padding:0 8px; border-radius:8px; font-size:14px; color:var(--tx); text-align:left; transition:background .12s; }
  .row:hover { background:var(--sf2); }
  .row.active { background:var(--sf2); }
  .row[disabled] { color:var(--tx3); cursor:not-allowed; }
  .row[disabled]:hover { background:none; }
  .row .grow { flex:1; }
  .row kbd { font:inherit; font-size:12px; color:var(--tx3); }
  .pill { font-size:11px; padding:1px 7px; border-radius:99px; background:var(--sf2); color:var(--tx2); }
  .sec-label { margin:22px 8px 6px; font-size:14px; color:var(--tx2); }
  #recent { flex:1; overflow-y:auto; min-height:0; }
  #recent .row { height:34px; color:var(--tx2); }
  #recent .row:hover { color:var(--tx); }
  #recent .row span.t { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dot { width:8px; height:8px; border-radius:50%; flex:none; }
  .empty { margin:0 8px; font-size:13px; color:var(--tx3); }
  .side-bottom { border-top:1px solid var(--ln); padding-top:8px; margin-top:8px; }

  /* ---------- 본문 ---------- */
  main { flex:1; min-width:0; position:relative; display:flex; flex-direction:column; }
  #menuBtn { display:none; position:absolute; top:12px; left:12px; width:36px; height:36px; border-radius:8px; align-items:center; justify-content:center; z-index:5; }
  #menuBtn:hover { background:var(--sf2); }
  #stage { flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 30px 70px 20px; }
  body.thread #stage, body.hist #stage { padding-bottom:0; }
  .col { width:100%; max-width:640px; }

  #hero { text-align:center; margin-bottom:36px; }
  #hero svg { width:36px; height:36px; margin-bottom:19px; color:var(--tx); }
  #hero h1 { margin:0; font-size:26px; line-height:39px; font-weight:350; letter-spacing:-.01em; color:var(--tx); }

  #composerWrap .box { min-height:120px; background:var(--box); border:1px solid var(--ln2); border-radius:20px; padding:12px 12px 10px 16px; transition:border-color .15s, box-shadow .15s; }
  #composerWrap .box:focus-within { border-color:rgba(219,222,227,.28); box-shadow:0 0 0 4px rgba(219,222,227,.05); }
  #claim { display:block; width:100%; min-height:52px; max-height:220px; resize:none; border:0; outline:0; background:transparent; color:var(--tx); font:inherit; font-size:16px; line-height:24px; padding:4px 0; }
  #claim::placeholder { color:var(--tx3); }
  .toolbar { display:flex; align-items:center; justify-content:space-between; margin-top:4px; }
  .chip { display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 12px; border-radius:99px; font-size:13px; background:var(--sf2); color:var(--tx); }
  #go { display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 14px 0 12px; border-radius:99px; background:#d4d7dc; color:#15171b; font-size:14px; font-weight:600; transition:background .12s, transform .12s; }
  #go:hover:not(:disabled) { background:#fff; }
  #go:active:not(:disabled) { transform:scale(.97); }
  #go:disabled { opacity:.45; cursor:wait; }
  #msgs { margin:0 8px; font-size:14px; }
  #status:not(:empty), #error:not(:empty) { margin-top:8px; }
  #status { color:var(--tx2); }
  #error { color:var(--red); font-weight:600; white-space:pre-wrap; }

  #examples { display:flex; gap:12px; margin-top:38px; }
  .ex { flex:1; min-height:88px; padding:16px; border-radius:12px; text-align:left; display:flex; flex-direction:column; gap:6px;
        transition:filter .15s, transform .15s; }
  .ex:hover { filter:brightness(1.12); transform:translateY(-1px); }
  .ex:active { transform:none; }
  .ex.a { background:linear-gradient(135deg,#2c7d84,#016a71 60%); }
  .ex.b { background:linear-gradient(135deg,#123036,#0d2226 70%); border:1px solid var(--ln2); }
  .ex b { display:flex; align-items:center; gap:8px; font-size:14px; font-weight:600; }
  .ex span { font-size:13px; line-height:1.45; color:rgba(255,255,255,.78); }

  /* 결과 보기 / 기록 보기 */
  #thread, #history, #article { display:none; width:100%; overflow-y:auto; flex:1; min-height:0; padding:56px 0 24px; }
  body.thread #thread { display:block; }
  body.hist #history { display:block; }
  body.article #article { display:block; }
  body.thread #stage, body.hist #stage, body.article #stage { justify-content:flex-start; }
  body.thread #hero, body.thread #examples, body.hist #hero, body.hist #examples, body.hist #composerWrap,
  body.article #hero, body.article #examples, body.article #composerWrap { display:none; }
  .col.wide { max-width:1100px; }
  #article .col.wide { max-width:820px; }
  h2 { letter-spacing:-.01em; }
  #article h2, #history h2 { margin:0 0 8px; font-size:26px; font-weight:400; }
  .hint { font-size:13px; color:var(--tx2); margin:0 0 14px; }
  .toolrow { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:12px 0; }
  .toolrow .hint { margin:0; }
  .urlrow { display:flex; gap:8px; margin-bottom:10px; }
  .urlrow input, .bigarea, .desk select, .desk textarea { background:var(--box); color:var(--tx); border:1px solid var(--ln2); border-radius:12px; font:inherit; font-size:15px; }
  .urlrow input { flex:1; height:44px; padding:0 14px; }
  .bigarea { width:100%; min-height:200px; padding:14px; resize:vertical; line-height:1.7; }
  .urlrow input:focus, .bigarea:focus, .desk select:focus, .desk textarea:focus { outline:0; border-color:rgba(219,222,227,.35); }
  .h3 .hint { font-weight:400; margin:0; }
  .err { color:var(--red); font-weight:600; font-size:14px; white-space:pre-wrap; }
  .err:not(:empty) { margin-top:8px; }
  .btn1:disabled, .btn2:disabled { opacity:.5; cursor:wait; }

  /* 데스크 확정 */
  .desk { border:1px solid var(--ln2); border-radius:12px; padding:16px; background:var(--sf); margin-top:8px; }
  .desk .h3 { margin-top:0; }
  .desk .fr { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; font-size:14px; color:var(--tx2); }
  .desk select { height:40px; padding:0 12px; }
  .desk textarea { width:100%; min-height:72px; padding:10px 12px; resize:vertical; line-height:1.6; }
  .desk .fr2 { display:flex; align-items:center; gap:12px; margin-top:10px; flex-wrap:wrap; }
  .desk .dmsg { font-size:13px; color:var(--tx2); }

  /* 기록 표 */
  .tblwrap { overflow-x:auto; border:1px solid var(--ln2); border-radius:12px; }
  table.rec { border-collapse:collapse; width:100%; min-width:980px; font-size:14px; }
  table.rec th { text-align:left; font-weight:600; color:var(--tx2); padding:10px 12px; border-bottom:1px solid var(--ln2); white-space:nowrap; background:var(--sf); }
  table.rec td { padding:10px 12px; border-top:1px solid var(--ln); vertical-align:top; line-height:1.5; }
  table.rec tr:first-child td { border-top:0; }
  table.rec td.memo { white-space:pre-wrap; min-width:160px; }
  table.rec td.time { white-space:nowrap; color:var(--tx2); }
  table.rec .urls a { display:block; max-width:240px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#7fd0d6; }
  .vp { display:inline-block; padding:2px 10px; border-radius:99px; color:#fff; font-size:12px; font-weight:700; white-space:nowrap; }
  .diff { font-size:11px; color:#ffb74d; margin-left:6px; }
  .delbtn { font-size:12px; color:var(--tx3); padding:2px 8px; border-radius:6px; }
  .delbtn:hover { background:var(--sf2); color:var(--red); }

  /* 기사 점검 */
  .orig { border:1px solid var(--ln2); border-radius:12px; padding:14px 16px; background:var(--sf); line-height:1.9; font-size:15px; }
  .orig .p { margin:0 0 6px; }
  .orig .s.chk { border-bottom:1px dotted rgba(219,222,227,.55); cursor:pointer; }
  .orig .s.chk:hover { background:rgba(219,222,227,.1); }
  .orig .s[class*="h-"] { border-bottom:0; color:#fff; border-radius:3px; padding:1px 0; box-decoration-break:clone; -webkit-box-decoration-break:clone; }
  .h-v-true { background:rgba(27,138,58,.65); } .h-v-mtrue { background:rgba(95,154,28,.6); } .h-v-half { background:rgba(196,127,0,.65); }
  .h-v-mfalse { background:rgba(211,87,26,.65); } .h-v-false { background:rgba(198,40,40,.7); } .h-v-hold { background:rgba(91,98,112,.7); }
  .aitem { border:1px solid var(--ln2); border-radius:12px; padding:14px 16px; margin-bottom:12px; background:var(--sf); }
  .aitem.flash { border-color:rgba(32,160,168,.9); }
  .aitem .top { display:flex; gap:10px; align-items:flex-start; }
  .aitem .txt { flex:1; line-height:1.6; }
  .aitem .k { font-size:11px; font-weight:700; padding:2px 8px; border-radius:6px; background:var(--sf2); color:var(--tx2); white-space:nowrap; margin-right:6px; }
  .aitem .vb { height:34px; padding:0 14px; border-radius:99px; background:#d4d7dc; color:#15171b; font-size:13px; font-weight:600; white-space:nowrap; }
  .aitem .vb:hover:not(:disabled) { background:#fff; }
  .aitem .vb:disabled { opacity:.5; cursor:wait; }
  .aitem .ast { font-size:13px; color:var(--tx2); margin-top:8px; }
  .aitem .res { margin-top:12px; }
  .aitem .res .part { margin-bottom:12px; }
  @media (max-width: 860px) { .urlrow { flex-direction:column; } }
  body.thread #composerWrap { padding:8px 0 20px; }
  #qTitle { margin:0 0 20px; font-size:26px; line-height:1.35; font-weight:400; letter-spacing:-.01em; word-break:keep-all; }

  .panel { border:1px solid var(--ln2); border-radius:12px; padding:16px; margin-bottom:16px; background:var(--sf); }
  #clarifyMsg { font-weight:600; }
  button.cand { display:block; width:100%; text-align:left; margin-top:10px; padding:12px 14px; border-radius:12px; border:1px solid var(--ln2); background:var(--box); line-height:1.5; transition:background .12s, border-color .12s; }
  button.cand:hover { background:var(--sf2); border-color:rgba(219,222,227,.28); }
  button.cand.orig { color:var(--tx2); font-size:14px; }

  .badge { display:inline-block; font-size:20px; font-weight:700; padding:6px 18px; border-radius:99px; color:#fff; }
  .v-true { background:#1b8a3a; } .v-mtrue { background:#5f9a1c; } .v-half { background:#c47f00; }
  .v-mfalse { background:#d3571a; } .v-false { background:#c62828; } .v-hold { background:#5b6270; }
  .verdict { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:6px; }
  .summary { font-size:18px; font-weight:600; line-height:1.45; }
  .part { margin-bottom:36px; }
  .partHead { font-size:18px; font-weight:600; margin:0 0 12px; padding-top:20px; border-top:1px solid var(--ln2); }
  #parts .part:first-child .partHead { border-top:0; padding-top:0; }
  .h3 { display:flex; align-items:center; gap:8px; margin:22px 0 10px; font-size:15px; font-weight:600; color:var(--tx); }
  .h3 svg { color:var(--tx2); }
  .reason { font-size:16px; line-height:1.7; white-space:pre-wrap; word-break:keep-all; }

  .cards { display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; }
  .scard { flex:0 0 190px; min-height:96px; display:flex; flex-direction:column; gap:6px; padding:12px; border-radius:12px; background:var(--sf2); text-decoration:none; transition:background .12s; }
  a.scard:hover { background:rgba(219,222,227,.11); }
  .scard .host { font-size:12px; color:var(--tx2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .scard .ttl { font-size:13px; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .scard .meta2 { margin-top:auto; font-size:12px; color:var(--tx3); display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .scard.used { box-shadow:inset 0 0 0 1px rgba(32,160,168,.7); }

  .evidence { border-top:1px solid var(--ln); padding:14px 0; }
  .evidence.used { background:rgba(32,160,168,.06); border-radius:8px; padding:14px 10px; }
  .evidence .title { font-weight:600; font-size:15px; }
  .evidence .meta { color:var(--tx2); font-size:13px; word-break:break-all; margin-top:2px; }
  .evidence .meta a { color:#7fd0d6; text-decoration:underline; text-underline-offset:2px; }
  .evidence .content { margin-top:6px; white-space:pre-wrap; font-size:14px; line-height:1.6; color:var(--tx2); }
  .kind { display:inline-block; font-size:11px; font-weight:600; color:#fff; border-radius:6px; padding:1px 7px; margin-right:6px; white-space:nowrap; vertical-align:1px; }
  .t-gov { background:#1d6fc0; } .t-stat { background:#0f8a7c; } .t-press { background:#6b45c4; }
  .t-enc { background:#8d6e00; } .t-blog { background:#b23a48; } .t-etc { background:#6b7280; } .t-old { background:#d1560c; }
  .tag { font-size:11px; background:#20a0a8; color:#06282b; font-weight:700; border-radius:6px; padding:1px 7px; margin-left:6px; vertical-align:1px; }
  #overall { border:1px solid rgba(32,160,168,.5); background:rgba(32,160,168,.06); border-radius:12px; padding:16px 18px; margin-bottom:28px; }
  #overall h2 { margin:0 0 10px; font-size:15px; font-weight:600; color:var(--tx2); }
  #overall .line { font-size:14px; color:var(--tx2); margin-top:6px; }
  #overall .meta { font-size:13px; color:var(--tx3); margin-top:8px; }

  /* 기록 */
  #history h2 { margin:0 0 16px; font-size:26px; font-weight:400; }
  .hrow { display:flex; align-items:center; gap:12px; width:100%; padding:14px 8px; border-top:1px solid var(--ln); border-radius:0; text-align:left; transition:background .12s; }
  .hrow:hover { background:var(--sf2); }
  .hrow .t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hrow .d { font-size:13px; color:var(--tx3); }
  .ghost { height:34px; padding:0 14px; border-radius:99px; border:1px solid var(--ln2); font-size:13px; color:var(--tx2); }
  .ghost:hover { background:var(--sf2); color:var(--tx); }

  /* 설정 창 */
  #modal { position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; padding:20px; }
  #modal[hidden] { display:none; }
  .dlg { width:100%; max-width:460px; background:#1b1e22; border:1px solid var(--ln2); border-radius:16px; padding:22px; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  .dlg h2 { margin:0 0 4px; font-size:18px; font-weight:600; display:flex; justify-content:space-between; align-items:center; }
  .dlg p { margin:0 0 14px; font-size:13px; color:var(--tx2); }
  .dlg label { display:block; margin:12px 0 6px; font-size:13px; color:var(--tx2); }
  .dlg input { width:100%; height:44px; padding:0 14px; border-radius:12px; border:1px solid var(--ln2); background:var(--box); color:var(--tx); font:inherit; font-size:15px; }
  .dlg input:focus { border-color:rgba(219,222,227,.35); outline:0; }
  .dlg .btns { display:flex; gap:8px; margin-top:18px; }
  .btn1 { height:40px; padding:0 18px; border-radius:10px; background:#d4d7dc; color:#15171b; font-weight:600; font-size:14px; transition:background .12s; }
  .btn1:hover { background:#fff; }
  .btn2 { height:40px; padding:0 18px; border-radius:10px; border:1px solid var(--ln2); font-size:14px; color:var(--tx2); transition:background .12s; }
  .btn2:hover { background:var(--sf2); color:var(--tx); }
  #keyMsg { margin-top:12px; font-size:13px; color:var(--tx2); min-height:18px; }
  .xbtn { width:30px; height:30px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; color:var(--tx2); }
  .xbtn:hover { background:var(--sf2); color:var(--tx); }

  @media (max-width: 860px) {
    #side { position:fixed; z-index:20; top:0; bottom:0; left:0; transform:translateX(-100%); background:#1a1c20; }
    body.side-open #side { transform:none; box-shadow:0 0 0 100vmax rgba(0,0,0,.5); }
    #menuBtn { display:flex; }
    #examples { flex-direction:column; }
    #hero h1 { font-size:22px; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="logo" viewBox="0 0 24 24"><path d="M12 2.5 4.5 5.5v5.7c0 4.6 3.1 8.4 7.5 10.3 4.4-1.9 7.5-5.7 7.5-10.3V5.5L12 2.5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="m8.5 12.2 2.4 2.4 4.7-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>
<div class="app">
  <aside id="side">
    <div class="side-top">
      <div class="brand"><svg><use href="#logo"/></svg>Fact Check</div>
      <button class="xbtn" id="sideClose" aria-label="사이드바 닫기" style="display:none"></button>
    </div>
    <button class="row" id="newBtn"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="grow">새 검증</span><kbd>Ctrl I</kbd></button>
    <nav>
      <button class="row active" id="navHome"><svg class="ic" viewBox="0 0 24 24"><path d="m5 12.5 4.2 4.2L19 7"/></svg><span class="grow">한 문장 검증</span></button>
      <button class="row" id="navArticle"><svg class="ic" viewBox="0 0 24 24"><path d="M6 3.5h9l3 3V20.5H6z"/><path d="M9 11h6M9 15h6"/></svg><span class="grow">기사 점검</span></button>
      <button class="row" id="navHist"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span class="grow">검증 기록</span></button>
    </nav>
    <div class="sec-label">최근 검증</div>
    <div id="recent"></div>
    <div class="side-bottom">
      <button class="row" id="openSettings"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg><span class="grow">설정</span></button>
    </div>
  </aside>

  <main>
    <button id="menuBtn" aria-label="메뉴 열기"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div id="stage">
      <div id="thread"><div class="col" style="margin:0 auto">
        <h2 id="qTitle"></h2>
        <section id="clarify" class="panel" hidden>
          <div id="clarifyMsg"></div>
          <div id="clarifyList"></div>
        </section>
        <section id="result" hidden>
          <div id="overall" hidden></div>
          <div id="parts"></div>
          <div id="deskBox"></div>
        </section>
      </div></div>

      <div id="history"><div class="col wide" style="margin:0 auto">
        <h2>검증 기록</h2>

        <button class="ex b" data-ex="한국의 합계출산율은 2023년에 0.7명 아래였다."><b><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>예시 주장</b><span>한국의 합계출산율은 2023년에 0.7명 아래였다.</span></button>

<div id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
  <div class="dlg">
    <h2 id="dlgTitle">설정<button class="xbtn" id="modalClose" aria-label="닫기"><svg class="ic" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></h2>
    <p>검증에 쓰는 키입니다. 키는 이 브라우저에만 저장되고 파일에는 적히지 않습니다.</p>
    <label for="tavilyKey">Tavily 키</label>
    <input type="password" id="tavilyKey" autocomplete="off">
    <label for="claudeKey">Claude 키</label>

      <button class="btn2" id="clearKeys">키 지우기</button>

    <div id="keyMsg"></div>
  </div>

<script>
// ===== 설정 (모델 이름은 여기서 바꿉니다) =====
const MODELS = ["claude-sonnet-5-5", "claude-haiku-5-5"];   // 한도 초과(429) 시 다음 모델로
const MAX_EVIDENCE = 5;
const NEWS_DAYS = 3650;     // 뉴스 검색 기간(일). 기본값 7일은 너무 짧아 약 10년으로 넓힘
const MAX_GOV_FIRST = 3;    // 정부·공공기관 검색 결과를 먼저 최대 몇 건까지 채울지
const GOV_SEARCH_DOMAINS = ["*.go.kr", "*.gov", "*.mil", "korea.kr", "kosis.kr", "un.org", "who.int", "oecd.org", "imf.org", "worldbank.org"];

// ----- 출처 종류 분류 (주소의 도메인으로 판단합니다. 목록은 여기서 추가·수정) -----
const TYPE_BLOG = "블로그·커뮤니티", TYPE_ENCYC = "백과사전", TYPE_STAT = "통계", TYPE_GOV = "정부·공공기관", TYPE_PRESS = "언론사", TYPE_ETC = "기타";
const TYPE_CLASS = { [TYPE_GOV]:"t-gov", [TYPE_STAT]:"t-stat", [TYPE_PRESS]:"t-press", [TYPE_ENCYC]:"t-enc", [TYPE_BLOG]:"t-blog", [TYPE_ETC]:"t-etc" };
const BLOG_DOMAINS = [
  "blog.naver.com", "cafe.naver.com", "post.naver.com", "tistory.com", "brunch.co.kr", "velog.io",
  "blog.daum.net", "cafe.daum.net", "medium.com", "blogspot.com", "wordpress.com", "reddit.com",
  "x.com", "twitter.com", "facebook.com", "instagram.com", "youtube.com", "threads.net", "quora.com",
  "dcinside.com", "fmkorea.com", "clien.net", "ppomppu.co.kr", "theqoo.net", "ruliweb.com",
  "instiz.net", "pann.nate.com", "mlbpark.donga.com", "bobaedream.co.kr", "inven.co.kr"
];
const ENCYC_DOMAINS = ["wikipedia.org", "namu.wiki", "wikiwand.com", "encykorea.aks.ac.kr", "britannica.com", "terms.naver.com", "doopedia.co.kr"];
const STAT_DOMAINS = ["kosis.kr", "kostat.go.kr", "index.go.kr", "ecos.bok.or.kr", "data.go.kr", "statista.com", "ourworldindata.org", "tradingeconomics.com", "data.worldbank.org", "stats.oecd.org"];
const PRESS_DOMAINS = [
  "chosun.com", "joongang.co.kr", "donga.com", "hani.co.kr", "khan.co.kr", "hankookilbo.com", "mk.co.kr",
  "hankyung.com", "sedaily.com", "fnnews.com", "mt.co.kr", "edaily.co.kr", "heraldcorp.com", "kmib.co.kr",
  "segye.com", "munhwa.com", "seoul.co.kr", "nocutnews.co.kr", "ohmynews.com", "pressian.com", "yna.co.kr",
  "yonhapnews.co.kr", "newsis.com", "news1.kr", "kbs.co.kr", "mbc.co.kr", "imnews.imbc.com", "sbs.co.kr",
  "jtbc.co.kr", "ytn.co.kr", "tvchosun.com", "mbn.co.kr", "news.naver.com", "n.news.naver.com", "v.daum.net",
  "bbc.com", "cnn.com", "reuters.com", "apnews.com", "nytimes.com", "washingtonpost.com", "bloomberg.com", "theguardian.com"
];
const hostIs = (h, d) => h === d || h.endsWith("." + d);
const inList = (h, list) => list.some(d => hostIs(h, d));
function classifySource(url, fromNews) {
  let h = "";
  try { h = new URL(url).hostname.toLowerCase(); } catch (e) { return TYPE_ETC; }
  if (inList(h, BLOG_DOMAINS)) return TYPE_BLOG;
  if (inList(h, ENCYC_DOMAINS)) return TYPE_ENCYC;
  if (inList(h, STAT_DOMAINS) || /(^|\.)(kosis|stat|stats)(\.|$)/.test(h)) return TYPE_STAT;
  if (/\.(go|gov)\.[a-z]{2}$/.test(h) || /\.(gov|mil)$/.test(h) || /\.gov\.[a-z]{2}$/.test(h) ||
      ["korea.kr", "un.org", "who.int", "oecd.org", "imf.org", "worldbank.org", "europa.eu"].some(d => hostIs(h, d))) return TYPE_GOV;
  if (inList(h, PRESS_DOMAINS)) return TYPE_PRESS;
  if (fromNews) return TYPE_PRESS;   // 뉴스 검색으로 나온 결과
  return TYPE_ETC;
}
const RETRY_503 = 2;        // 503이면 추가로 다시 시도할 횟수
const WAIT_503_MS = 3000;   // 503이면 쉬는 시간
const VERDICTS = ["사실", "대체로 사실", "절반의 사실", "대체로 사실 아님", "사실 아님", "판단 유보"];
const VERDICT_CLASS = {
  "사실":"v-true", "대체로 사실":"v-mtrue", "절반의 사실":"v-half",
  "대체로 사실 아님":"v-mfalse", "사실 아님":"v-false", "판단 유보":"v-hold"
};
const LS_TAVILY = "factcheck_tavily_key";
const LS_CLAUDE = "factcheck_claude_key";

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ===== 키 저장 / 불러오기 / 지우기 =====
function lsGet(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }
function keyMsg(t) { $("keyMsg").textContent = t; }

$("tavilyKey").value = lsGet(LS_TAVILY);
$("claudeKey").value = lsGet(LS_CLAUDE);
if (lsGet(LS_TAVILY) || lsGet(LS_CLAUDE)) keyMsg("저장된 키를 불러왔습니다.");

$("saveKeys").onclick = () => {
  try {
    localStorage.setItem(LS_TAVILY, $("tavilyKey").value.trim());
    localStorage.setItem(LS_CLAUDE, $("claudeKey").value.trim());
    keyMsg("키를 이 브라우저에 저장했습니다.");
  } catch (e) { keyMsg("키를 저장하지 못했습니다. 브라우저 저장소가 막혀 있을 수 있습니다."); }
};
$("clearKeys").onclick = () => {
  try { localStorage.removeItem(LS_TAVILY); localStorage.removeItem(LS_CLAUDE); } catch (e) {}
  $("tavilyKey").value = ""; $("claudeKey").value = "";
  keyMsg("저장된 키를 지웠습니다.");
};

// ===== Tavily 검색 =====
// 정부·공공기관 검색을 먼저(최대 MAX_GOV_FIRST건), 나머지는 뉴스·일반 검색 결과를 번갈아 채워 최대 5건을 씁니다.
async function searchTavily(claim, key) {
  const [gov, news, general] = await Promise.all([
    // 정부 검색이 형식 문제 등으로 실패해도 나머지 검색은 계속합니다 (키 오류·한도 초과는 그대로 알림)
    searchOnce(claim, key, { topic: "general", include_domains: GOV_SEARCH_DOMAINS })
      .catch(e => { if (/키가|한도|연결/.test(e.message)) throw e; return []; }),
    searchOnce(claim, key, { topic: "news", days: NEWS_DAYS }),
    searchOnce(claim, key, { topic: "general" })
  ]);
  const merged = [], seen = new Set();
  const push = (e, fromNews) => {
    if (!e || !e.url || seen.has(e.url)) return;
    seen.add(e.url);
    e.type = classifySource(e.url, fromNews);
    applyDate(e);
    merged.push(e);
  };
  gov.slice(0, MAX_GOV_FIRST).forEach(e => push(e, false));
  for (let i = 0; i < Math.max(news.length, general.length); i++) {
    push(news[i], true);
    push(general[i], false);
  }
  // 주장에 연도가 있으면: 그 연도 이후 자료 → 날짜 불명 → 그 연도 이전 자료 순으로 먼저 씁니다 (같은 그룹 안에서는 기존 순서 유지)
  const cy = claimYear(claim);
  if (cy) {
    const rank = e => e.ts === null ? 1 : (e.ts >= Date.UTC(cy, 0, 1) ? 0 : 2);
    merged.sort((a, b) => rank(a) - rank(b));   // 정렬은 안정 정렬
  }
  return merged.slice(0, MAX_EVIDENCE);
}

// ----- 날짜 처리 -----
const OLD_DAYS = 365;
function claimYear(claim) {
  const ys = (claim.match(/(?<!\d)(19|20)\d{2}(?!\d)/g) || []).map(Number).filter(y => y <= new Date().getFullYear() + 1);
  return ys.length ? Math.min(...ys) : null;   // 여러 연도가 있으면 가장 이른 연도 기준
}
function applyDate(e) {
  const t = Date.parse(e.date);
  if (isNaN(t) || e.date === "날짜 정보 없음") { e.ts = null; e.date = "날짜 정보 없음"; e.old = false; return; }
  const d = new Date(t);
  e.ts = t;
  e.date = d.getUTCFullYear() + "-" + String(d.getUTCMonth() + 1).padStart(2, "0") + "-" + String(d.getUTCDate()).padStart(2, "0");
  e.old = (Date.now() - t) > OLD_DAYS * 86400000;
}

async function searchOnce(claim, key, extra) {
  let res;
  try {
    res = await fetch("https://api.tavily.com/search", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
      body: JSON.stringify(Object.assign({
        query: claim, max_results: MAX_EVIDENCE, search_depth: "advanced"
      }, extra))
    });
  } catch (e) {
    throw new Error("Tavily에 연결하지 못했습니다. 인터넷 연결을 확인해 주세요.");
  }
  if (res.status === 401 || res.status === 403) throw new Error("Tavily 키가 올바르지 않거나 권한이 없습니다. (" + res.status + ")");
  if (res.status === 429) throw new Error("Tavily 사용 한도를 초과했습니다. (429)");
  if (!res.ok) throw new Error("Tavily 검색 오류입니다. (" + res.status + ")");
  const data = await res.json();
  const list = Array.isArray(data.results) ? data.results : [];
  return list.slice(0, MAX_EVIDENCE).map(r => ({
    title: String(r.title || "(제목 없음)"),
    date: String(r.published_date || r.date || "날짜 정보 없음"),
    url: String(r.url || ""),
    content: String(r.content || "")
  }));
}

// ===== Claude 호출 (429 → 다음 모델, 503/529 → 3초 쉬고 재시도) =====
function buildPrompt(claim, evidence) {
  const ev = evidence.map((e, i) =>
    `[근거 ${i + 1}]\n출처 종류: ${e.type}\n제목: ${e.title}\n날짜: ${e.date}${e.old ? " (오래된 자료: 1년 넘음)" : ""}\n출처: ${e.url}\n내용: ${e.content}`).join("\n\n");
  return `당신은 지역 언론사 기자를 돕는 팩트체크 보조자입니다.
아래 [근거]에 적힌 내용만 보고 [주장]을 판정하세요. 근거에 없는 내용은 절대 지어내거나 추측하지 마세요. 당신이 원래 알고 있는 지식은 쓰지 마세요.

규칙:
- 주장 속 사람 이름, 기관, 지역, 날짜가 근거와 정확히 맞을 때만 그 근거를 사용합니다. 이름 일부만 같거나, 다른 지역·다른 기관이면 관련 없는 근거로 보고 쓰지 않습니다.
- 각 근거에는 "출처 종류"가 붙어 있습니다(정부·공공기관 / 통계 / 언론사 / 백과사전 / 블로그·커뮤니티 / 기타). 정부·공공기관, 통계, 언론사 자료를 우선해서 판단하세요.
- 근거의 날짜를 확인하세요. 주장이 말하는 시점이나 기간과 근거의 날짜가 맞지 않으면(예: 2024년 주장인데 2021년 자료) 그 근거로 판정하지 마세요. "오래된 자료"는 지금 상황과 다를 수 있으니, 이유에 오래된 자료라는 점을 밝히고 신중하게 판단하세요. 날짜 정보가 없는 근거는 날짜를 모른다는 점을 이유에 밝히세요.
- "블로그·커뮤니티" 근거는 단독 근거로 쓰지 마세요. 정부·공공기관, 통계, 언론사 근거가 뒷받침하는 경우에만 보조로 인용할 수 있고, 그 근거들 없이 블로그·커뮤니티만으로는 판정하지 말고 "판단 유보"로 답하세요. 기업 홍보 글이나 출처가 불분명한 글도 공신력 있는 근거로 보지 마세요.
- 주장과 직접 관련된 근거가 하나도 없으면 판정은 "판단 유보"입니다.
- 판정은 반드시 다음 6개 중 하나여야 합니다: ${VERDICTS.join(" / ")}
- 이유(reason)에는 근거 번호를 [1], [2] 형태로 붙이세요.
- 사용한 근거 번호만 used_evidence에 정수 배열로 넣으세요. 없으면 빈 배열.
- 반드시 아래 JSON 형식으로만, 한국어로 답하세요.
{"verdict":"...","summary":"한 줄 요약","reason":"이유 [번호]","used_evidence":[1,2]}

[주장]
${claim}

[근거]
${ev}`;
}

// 답을 항상 올바른 JSON으로 받기 위한 "도구 호출" 형식 (Claude가 이 형식에 맞춰서만 답하게 강제)
const TOOL_VERDICT = { name: "report_verdict", description: "판정 결과를 보고한다", schema: {
  type: "object", required: ["verdict", "summary", "reason", "used_evidence"],
  properties: { verdict: { type: "string", enum: VERDICTS }, summary: { type: "string" }, reason: { type: "string" }, used_evidence: { type: "array", items: { type: "integer" } } } } };
const TOOL_ANALYZE = { name: "report_analysis", description: "주장 나누기와 모호함 점검 결과를 보고한다", schema: {
  type: "object", required: ["claims", "ambiguous"],
  properties: { claims: { type: "array", items: { type: "string" } }, ambiguous: { type: "boolean" }, missing: { type: "array", items: { type: "string" } }, candidates: { type: "array", items: { type: "string" } } } } };
const TOOL_EXTRACT = { name: "report_sentences", description: "확인할 수 있는 문장의 번호를 보고한다", schema: {
  type: "object", required: ["items"],
  properties: { items: { type: "array", items: { type: "object", required: ["id", "kind"], properties: { id: { type: "integer" }, kind: { type: "string", enum: ["숫자", "날짜", "직함", "발언", "기타사실"] } } } } } } };

async function callClaude(prompt, key, tool) {
  let lastStatus = 0;
  for (let m = 0; m < MODELS.length; m++) {
    const model = MODELS[m];
    for (let attempt = 0; attempt <= RETRY_503; attempt++) {
      let res;
      try {
        res = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-api-key": key,
            "anthropic-version": "2023-06-01",
            "anthropic-dangerous-direct-browser-access": "true"
          },
          body: JSON.stringify(Object.assign({
            model, max_tokens: 2048,
            messages: [{ role: "user", content: tool ? prompt + `\n\n반드시 ${tool.name} 도구를 호출해서 답하세요. 글로 답하지 마세요.` : prompt }]
          }, tool ? {
            // 이 모델은 tool_choice 강제(tool/any)를 지원하지 않아, 도구만 주고 지시문으로 호출을 요청합니다
            tools: [{ name: tool.name, description: tool.description, input_schema: tool.schema }]
          } : {}))
        });
      } catch (e) {
        throw new Error("Claude에 연결하지 못했습니다. 인터넷 연결을 확인해 주세요.");
      }
      lastStatus = res.status;
      if (res.ok) {
        const data = await res.json();
        const blocks = data && Array.isArray(data.content) ? data.content : [];
        const tu = blocks.find(b => b && b.type === "tool_use" && b.input && typeof b.input === "object");
        // 도구 호출로 받은 답은 이미 해석된 객체이므로 JSON 글자로 되돌려 기존 처리 코드에 그대로 넘깁니다
        const text = tu ? JSON.stringify(tu.input) : blocks.filter(b => b && b.type === "text").map(b => b.text || "").join("");
        return { text, model };
      }
      if (res.status === 429) {
        if (m < MODELS.length - 1) { $("status").textContent = `${model} 한도 초과. ${MODELS[m + 1]}로 바꿔 다시 시도합니다...`; break; }
        throw new Error("모든 Claude 모델의 사용 한도를 초과했습니다. (429) 잠시 후 다시 시도해 주세요.");
      }
      if (res.status === 503 || res.status === 529) {
        if (attempt < RETRY_503) { $("status").textContent = `${model} 사용량이 많습니다. 3초 후 다시 시도합니다... (${attempt + 1}/${RETRY_503})`; await sleep(WAIT_503_MS); continue; }
        throw new Error("Claude 서버 사용량이 많아 응답하지 못했습니다. (" + res.status + ") 잠시 후 다시 시도해 주세요.");
      }
      if (res.status === 401 || res.status === 403)
        throw new Error("Claude 키가 올바르지 않거나 권한이 없습니다. (" + res.status + ")");
      if (res.status === 400) {
        let detail = "";
        try { const j = await res.json(); detail = j && j.error && j.error.message ? " " + j.error.message : ""; } catch (e) {}
        throw new Error("Claude 요청이 거부되었습니다. (400)" + detail);
      }
      if (res.status === 404) throw new Error(`Claude 모델 "${model}"을(를) 찾을 수 없습니다. (404) 파일 위쪽 MODELS 설정의 모델 이름을 확인해 주세요.`);
      throw new Error("Claude 오류입니다. (" + res.status + ")");
    }
  }
  throw new Error("Claude 응답을 받지 못했습니다. (" + lastStatus + ")");
}

// 답에 설명 글이나 ```json 울타리가 섞여 있어도 첫 { 부터 마지막 } 까지를 JSON으로 읽습니다.
function parseJsonLoose(text) {
  const t = String(text || "");
  const s = t.indexOf("{"), e = t.lastIndexOf("}");
  if (s < 0 || e <= s) throw new SyntaxError("JSON 없음");
  return JSON.parse(t.slice(s, e + 1));
}

// Claude 답 정리: 6단계 밖이면 판단 유보
function parseVerdict(text, evidence) {
  const evCount = evidence.length;
  const hold = (summary, reason) => ({ verdict: "판단 유보", summary, reason, used: [] });
  let obj;
  try {
    obj = parseJsonLoose(text);
  } catch (e) {
    const snip = String(text || "").trim().slice(0, 200);
    return hold("Claude의 답을 해석하지 못했습니다.", "응답이 약속된 JSON 형식이 아니어서 판단을 유보합니다." + (snip ? "\n(받은 응답 앞부분: " + snip + ")" : "\n(받은 응답이 비어 있습니다.)"));
  }
  if (!obj || typeof obj !== "object" || Array.isArray(obj))
    return hold("Claude의 답을 해석하지 못했습니다.", "응답이 약속된 JSON 형식이 아니어서 판단을 유보합니다.");
  const used = (Array.isArray(obj.used_evidence) ? obj.used_evidence : [])
    .map(Number).filter((n, i, a) => Number.isInteger(n) && n >= 1 && n <= evCount && a.indexOf(n) === i);
  const verdict = String(obj.verdict || "").trim();
  const summary = String(obj.summary || "").trim();
  const reason = String(obj.reason || "").trim();
  if (!VERDICTS.includes(verdict))
    return hold(summary || "판정이 정해진 6단계 밖의 말로 와서 판단을 유보합니다.", reason || "허용되지 않은 판정 값이 와서 판단 유보로 처리했습니다.");
  if (verdict !== "판단 유보" && used.length === 0)
    return hold("사용한 근거가 확인되지 않아 판단을 유보합니다.", "판정에 쓴 근거 번호가 없어 판단 유보로 처리했습니다.");
  if (verdict !== "판단 유보" && used.every(n => evidence[n - 1].type === TYPE_BLOG))
    return hold("블로그·커뮤니티 글만으로는 판정할 수 없어 판단을 유보합니다.", "판정에 쓴 근거가 모두 블로그·커뮤니티 글이어서 판단 유보로 처리했습니다.");
  return { verdict, summary, reason, used };
}

// ===== 화면 표시 (모두 textContent로만 넣음) =====
function renderPart(r, evidence, heading, target) {
  if (!target) $("result").hidden = false;
  const sec = document.createElement("div");
  sec.className = "part";
  if (heading) { const h = document.createElement("h2"); h.className = "partHead"; h.textContent = heading; sec.appendChild(h); }
  const mk = (tag, cls, text) => { const x = document.createElement(tag); if (cls) x.className = cls; if (text !== undefined) x.textContent = text; return x; };
  // 순서: 판정 배지 + 한 줄 요약 → 출처 카드 → 판정 이유 → 근거
  const vrow = mk("div", "verdict");
  vrow.append(mk("div", "badge " + VERDICT_CLASS[r.verdict], r.verdict), mk("div", "summary", r.summary));
  sec.appendChild(vrow);

  sec.appendChild(mk("div", "h3", "출처"));
  const cards = mk("div", "cards");
  evidence.forEach((e, i) => {
    const ok = /^https?:\/\//i.test(e.url);
    const c = mk(ok ? "a" : "div", "scard" + (r.used.includes(i + 1) ? " used" : ""));
    if (ok) { c.href = e.url; c.target = "_blank"; c.rel = "noopener noreferrer"; }
    let host = e.url || "주소 없음";
    try { host = new URL(e.url).hostname.replace(/^www\./, ""); } catch (x) {}
    const meta2 = mk("div", "meta2");
    meta2.append(mk("span", "kind " + (TYPE_CLASS[e.type] || "t-etc"), e.type || TYPE_ETC), document.createTextNode(e.date));
    if (e.old) meta2.appendChild(mk("span", "kind t-old", "오래된 자료"));
    c.append(mk("div", "host", `[${i + 1}] ${host}`), mk("div", "ttl", e.title), meta2);
    cards.appendChild(c);
  });
  if (evidence.length === 0) sec.appendChild(mk("div", "empty", "찾은 근거가 없습니다."));
  else sec.appendChild(cards);

  sec.appendChild(mk("div", "h3", "판정 이유"));
  sec.appendChild(mk("div", "reason", r.reason));
  sec.appendChild(mk("div", "h3", "근거"));
  const box = mk("div");
  sec.appendChild(box);
  (target || $("parts")).appendChild(sec);
  if (evidence.length === 0) {
    box.appendChild(mk("div", "empty", "찾은 근거가 없습니다."));
    return;
  }
  evidence.forEach((e, i) => {
    const d = document.createElement("div");
    const isUsed = r.used.includes(i + 1);
    d.className = "evidence" + (isUsed ? " used" : "");

    const t = document.createElement("div");
    t.className = "title";
    const kind = document.createElement("span");
    kind.className = "kind " + (TYPE_CLASS[e.type] || "t-etc");
    kind.textContent = e.type || TYPE_ETC;
    t.append(kind, document.createTextNode(` [${i + 1}] ${e.title}`));
    if (isUsed) { const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = "판정에 사용"; t.appendChild(tag); }

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.appendChild(document.createTextNode("날짜: " + e.date));
    if (e.old) { const o = document.createElement("span"); o.className = "kind t-old"; o.style.marginLeft = "6px"; o.textContent = "오래된 자료"; meta.appendChild(o); }
    meta.appendChild(document.createTextNode(" · 출처: "));
    if (/^https?:\/\//i.test(e.url)) {
      const a = document.createElement("a");
      a.href = e.url; a.target = "_blank"; a.rel = "noopener noreferrer";
      a.textContent = e.url;
      meta.appendChild(a);
    } else {
      meta.appendChild(document.createTextNode(e.url || "주소 없음"));
    }

    const c = document.createElement("div");
    c.className = "content";
    c.textContent = e.content;

    d.append(t, meta, c);
    box.appendChild(d);
  });
}

// ===== 검증하기 =====
// ----- 모호한 주장 점검: 기준·기간·지역이 빠졌는지 보고, 빠졌으면 다듬은 문장 후보를 받음 -----
const MAX_CLAIMS = 4;   // 한 문장에서 나눌 수 있는 주장의 최대 개수

function buildClarifyPrompt(claim, checkAmbiguity) {
  return `당신은 팩트체크 기자를 돕는 보조자입니다. 아래 [주장]을 두 가지로 점검하세요.

(가) 주장 나누기: 한 문장에 서로 따로 확인할 수 있는 주장이 둘 이상 섞여 있으면 각각 하나의 완결된 문장으로 나누세요.
- 나눈 문장은 그것만 읽어도 이해되도록, 원래 문장의 주어·기관·지역·기간을 그대로 가져와 채우세요. 원문에 없는 사람, 기관, 수치, 사실은 절대 넣지 마세요.
- 하나의 주장이면 원래 문장을 그대로 한 개만 넣으세요. 최대 ${MAX_CLAIMS}개까지만 나누세요.
${checkAmbiguity ? `
(나) 모호함 점검: 검증하려면 필요한 정보가 빠져 있으면 모호한 주장입니다: 기준(무엇을 어떤 지표·정의로 보는지), 기간(언제 또는 어느 기간), 지역(어느 지역·기관).
- 모호하면 "ambiguous":true 로 하고, 빠진 항목과 검증할 수 있게 다듬은 문장 후보를 2~3개 제시하세요. 후보마다 기준·기간·지역이 서로 다르게 구체화된 문장이어야 합니다.
- 후보에도 [주장]에 없는 사람, 기관, 수치, 사실을 새로 만들어 넣지 마세요. 빠진 기준·기간·지역을 구체화하는 것만 하세요. 특정할 수 없으면 "최근 1년", "전국"처럼 범위를 명시하는 식으로 쓰세요.
- 충분히 구체적이면 "ambiguous":false 로 하세요.` : `
(나) 모호함 점검은 하지 말고 "ambiguous":false 로 답하세요.`}

반드시 아래 JSON으로만, 한국어로 답하세요.
{"claims":["주장 1","주장 2"],"ambiguous":false,"missing":[],"candidates":[]}

[주장]
${claim}`;
}

// 반환: { claims: [...], clarify: {missing, cands} 또는 null }. 해석 실패 시 막지 않고 원문 하나로 검증합니다.
function parseAnalysis(text, original) {
  const fallback = { claims: [original], clarify: null };
  try {
    const obj = parseJsonLoose(text);
    if (!obj || typeof obj !== "object") return fallback;
    let claims = (Array.isArray(obj.claims) ? obj.claims : []).map(c => String(c).trim())
      .filter((c, i, a) => c && a.indexOf(c) === i).slice(0, MAX_CLAIMS);
    if (claims.length === 0) claims = [original];
    let clarify = null;
    if (obj.ambiguous === true) {
      const cands = (Array.isArray(obj.candidates) ? obj.candidates : [])
        .map(c => String(c).trim()).filter((c, i, a) => c && a.indexOf(c) === i).slice(0, 3);
      if (cands.length > 0) clarify = { missing: (Array.isArray(obj.missing) ? obj.missing : []).map(String).filter(Boolean), cands };
    }
    return { claims, clarify };
  } catch (e) { return fallback; }
}

// 전체 판정: 부분 판정들을 정해진 규칙으로 합칩니다 (Claude에게 다시 묻지 않음)
const SCORE = { "사실": 2, "대체로 사실": 1, "절반의 사실": 0, "대체로 사실 아님": -1, "사실 아님": -2 };
const SCORE_LABEL = { 2: "사실", 1: "대체로 사실", 0: "절반의 사실", "-1": "대체로 사실 아님", "-2": "사실 아님" };
function overallVerdict(verdicts) {
  const scores = verdicts.filter(v => v in SCORE).map(v => SCORE[v]);
  const holds = verdicts.length - scores.length;
  if (scores.length === 0) return { verdict: "판단 유보", note: "모든 주장이 판단 유보여서 전체도 판단을 유보합니다." };
  const hasPos = scores.some(s => s > 0), hasNeg = scores.some(s => s < 0);
  if (holds > 0 && !hasNeg) return { verdict: "판단 유보", note: "일부 주장이 판단 유보라서, 전체를 맞다고 말할 수 없어 판단을 유보합니다." };
  let verdict;
  if (hasPos && hasNeg) verdict = "절반의 사실";
  else if (!hasNeg) verdict = SCORE_LABEL[Math.min(...scores)];                       // 모두 맞는 쪽: 가장 약한 고리 기준
  else verdict = SCORE_LABEL[Math.trunc(scores.reduce((a, b) => a + b, 0) / scores.length)]; // 모두 틀린 쪽: 평균
  return { verdict, note: holds > 0 ? "판단 유보인 주장은 빼고, 틀린 쪽으로 나온 주장들을 기준으로 합쳤습니다." : "" };
}

function renderOverall(items) {
  const o = overallVerdict(items.map(i => i.r.verdict));
  const box = $("overall");
  box.textContent = "";
  box.hidden = false;
  const h = document.createElement("h2"); h.textContent = "전체 판정";
  const b = document.createElement("div"); b.textContent = o.verdict; b.className = "badge " + VERDICT_CLASS[o.verdict];
  box.append(h, b);
  items.forEach((it, i) => {
    const line = document.createElement("div");
    line.className = "line";
    line.textContent = `주장 ${i + 1}: ${it.r.verdict} — ${it.claim}`;
    box.appendChild(line);
  });
  if (o.note) { const n = document.createElement("div"); n.className = "meta"; n.textContent = o.note; box.appendChild(n); }
}

function showClarify(origClaim, c) {
  const box = $("clarify");
  box.hidden = false;
  $("clarifyMsg").textContent = "주장이 모호합니다" + (c.missing.length ? " (빠진 정보: " + c.missing.join(", ") + ")" : "")
    + ". 검증할 문장을 골라 주세요.";
  const list = $("clarifyList");
  list.textContent = "";
  const add = (label, claim, cls) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "cand" + (cls ? " " + cls : "");
    b.textContent = label;
    b.onclick = () => { $("claim").value = claim; verify(claim, true); };
    list.appendChild(b);
  };
  c.cands.forEach(t => add(t, t));
  add("원래 문장 그대로 검증: " + origClaim, origClaim, "orig");
}

$("go").onclick = () => verify($("claim").value.trim(), false);

// 주장 하나를 검색하고 판정합니다 (한 문장 검증과 기사 점검이 함께 씀). onStatus로 진행 상황을 알립니다.
async function checkOne(c, tKey, gKey, onStatus) {
  onStatus("근거를 찾는 중입니다...");
  const evidence = await searchTavily(c, tKey);
  let r, model = "";
  if (evidence.length === 0) {
    r = { verdict: "판단 유보", summary: "관련 근거를 찾지 못했습니다.", reason: "검색 결과가 0건이어서 판단을 유보합니다.", used: [] };
  } else if (evidence.every(e => e.type === TYPE_BLOG)) {
    r = { verdict: "판단 유보", summary: "블로그·커뮤니티 글만 찾아 판단을 유보합니다.", reason: "찾은 근거가 모두 블로그·커뮤니티 글이어서 판단을 유보합니다.", used: [] };
  } else {
    onStatus("근거를 바탕으로 판정하는 중입니다...");
    const res = await callClaude(buildPrompt(c, evidence), gKey, TOOL_VERDICT);
    model = res.model;
    r = parseVerdict(res.text, evidence);
  }
  return { r, evidence, model };
}

async function verify(claim, skipClarify) {
  const tKey = $("tavilyKey").value.trim();
  const gKey = $("claudeKey").value.trim();
  $("error").textContent = "";
  $("status").textContent = "";
  $("result").hidden = true;
  $("clarify").hidden = true;
  $("overall").hidden = true;
  $("overall").textContent = "";
  $("parts").textContent = "";
  $("deskBox").textContent = "";

  if (!claim) { $("error").textContent = "검증할 주장을 입력해 주세요."; return; }
  if (!tKey) { $("error").textContent = "Tavily 키를 입력해 주세요. (왼쪽 아래 설정)"; openSettings(); return; }
  if (!gKey) { $("error").textContent = "Claude 키를 입력해 주세요. (왼쪽 아래 설정)"; openSettings(); return; }

  enterThread(claim);
  $("go").disabled = true;
  try {
    $("status").textContent = skipClarify ? "주장을 나누는 중입니다..." : "주장이 구체적인지, 여러 주장이 섞였는지 확인하는 중입니다...";
    const an = parseAnalysis((await callClaude(buildClarifyPrompt(claim, !skipClarify), gKey, TOOL_ANALYZE)).text, claim);
    if (an.clarify) { $("status").textContent = ""; showClarify(claim, an.clarify); return; }

    const items = [];
    let lastModel = "";
    for (let i = 0; i < an.claims.length; i++) {
      const c = an.claims[i];
      const multi = an.claims.length > 1;
      const tag = multi ? `주장 ${i + 1}/${an.claims.length}: ` : "";
      const { r, evidence, model } = await checkOne(c, tKey, gKey, s => { $("status").textContent = tag + s; });
      if (model) lastModel = model;
      items.push({ claim: c, r, evidence });
      renderPart(r, evidence, multi ? `주장 ${i + 1}: ${c}` : "");
    }
    if (items.length > 1) renderOverall(items);
    const verifiedAt = Date.now();
    saveHistory(claim, items);
    mountDesk(claim, items, verifiedAt);
    $("status").textContent = lastModel ? "사용 모델: " + lastModel : "";
  } catch (e) {
    $("status").textContent = "";
    $("error").textContent = "오류: " + (e && e.message ? e.message : "알 수 없는 오류가 발생했습니다.");
  } finally {
    $("go").disabled = false;
  }
}

// ===== 화면 뼈대: 보기 전환 · 사이드바 · 설정 창 · 기록 (검색·판정 기능과 무관한 화면 코드) =====
const LS_HIST = "factcheck_history";
const VERDICT_COLOR = { "사실":"#1b8a3a", "대체로 사실":"#5f9a1c", "절반의 사실":"#c47f00", "대체로 사실 아님":"#d3571a", "사실 아님":"#c62828", "판단 유보":"#5b6270" };

function setView(v) {
  ["thread", "hist", "article"].forEach(k => document.body.classList.toggle(k, v === k));
  $("navHome").classList.toggle("active", v === "home" || v === "thread");
  $("navHist").classList.toggle("active", v === "hist");
  $("navArticle").classList.toggle("active", v === "article");
  document.body.classList.remove("side-open");
}
function enterThread(q) { $("qTitle").textContent = q; setView("thread"); }
function autosize() { const t = $("claim"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 220) + "px"; }
function newCheck() {
  setView("home");
  ["clarify", "result", "overall"].forEach(id => { $(id).hidden = true; });
  $("parts").textContent = ""; $("overall").textContent = ""; $("deskBox").textContent = "";
  $("status").textContent = ""; $("error").textContent = "";
  $("claim").value = ""; autosize(); $("claim").focus();
}

// 설정 창
function openSettings() { $("modal").hidden = false; ($("tavilyKey").value ? $("claudeKey") : $("tavilyKey")).focus(); }
function closeSettings() { $("modal").hidden = true; }
$("openSettings").onclick = openSettings;
$("modalClose").onclick = closeSettings;
$("modal").addEventListener("mousedown", e => { if (e.target === $("modal")) closeSettings(); });
$("saveKeys").addEventListener("click", () => {
  setTimeout(() => { if ($("tavilyKey").value.trim() && $("claudeKey").value.trim() && lsGet(LS_TAVILY)) closeSettings(); }, 600);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("modal").hidden) closeSettings();
  if (e.ctrlKey && !e.shiftKey && !e.altKey && e.key.toLowerCase() === "i") { e.preventDefault(); newCheck(); }
});

// 입력창: Enter로 검증, Shift+Enter로 줄바꿈
$("claim").addEventListener("input", autosize);
$("claim").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && !$("go").disabled) { e.preventDefault(); $("go").click(); }
});
document.querySelectorAll(".ex").forEach(b => b.onclick = () => { $("claim").value = b.dataset.ex; autosize(); $("claim").focus(); });

// 사이드바
$("newBtn").onclick = newCheck;
$("navHome").onclick = () => setView($("parts").children.length || !$("clarify").hidden ? "thread" : "home");
$("navHist").onclick = () => { renderHist(); setView("hist"); };
$("navArticle").onclick = () => setView("article");
$("menuBtn").onclick = () => document.body.classList.toggle("side-open");
document.querySelector("main").addEventListener("click", e => { if (document.body.classList.contains("side-open") && e.target !== $("menuBtn")) document.body.classList.remove("side-open"); });

// 기록 (이 브라우저에만 저장, 최대 20건)
function loadHist() { try { const a = JSON.parse(localStorage.getItem(LS_HIST) || "[]"); return Array.isArray(a) ? a : []; } catch (e) { return []; } }
function storeHist(a) { try { localStorage.setItem(LS_HIST, JSON.stringify(a)); } catch (e) {} }
function saveHistory(claim, items) {
  const verdict = items.length > 1 ? overallVerdict(items.map(i => i.r.verdict)).verdict : items[0].r.verdict;
  const slim = items.map(it => ({ claim: it.claim, r: it.r, evidence: it.evidence.map(e => Object.assign({}, e, { content: String(e.content).slice(0, 600) })) }));
  const a = loadHist();
  a.unshift({ id: Date.now(), claim, verdict, items: slim });
  storeHist(a.slice(0, 20));
  renderRecent();
}
function openEntry(en) {
  enterThread(en.claim);
  $("clarify").hidden = true; $("error").textContent = ""; $("status").textContent = "";
  $("overall").hidden = true; $("overall").textContent = ""; $("parts").textContent = ""; $("deskBox").textContent = "";
  const multi = en.items.length > 1;
  en.items.forEach((it, i) => renderPart(it.r, it.evidence, multi ? `주장 ${i + 1}: ${it.claim}` : ""));
  if (multi) renderOverall(en.items);
  mountDesk(en.claim, en.items, en.id);
}
function histRow(en, cls) {
  const b = document.createElement("button");
  b.className = cls;
  const dot = document.createElement("span"); dot.className = "dot"; dot.style.background = VERDICT_COLOR[en.verdict] || "#5b6270";
  const t = document.createElement("span"); t.className = "t"; t.textContent = en.claim;
  b.append(dot, t);
  b.onclick = () => openEntry(en);
  return b;
}
function renderRecent() {
  const box = $("recent"); box.textContent = "";
  const a = loadHist().slice(0, 8);
  if (a.length === 0) { const p = document.createElement("div"); p.className = "empty"; p.textContent = "최근 검증이 없습니다."; box.appendChild(p); return; }
  a.forEach(en => box.appendChild(histRow(en, "row")));
}

// ===== 데스크 확정 · 검증 기록 표 · CSV =====
const LS_DESK = "factcheck_desk";
const el = (tag, cls, text) => { const x = document.createElement(tag); if (cls) x.className = cls; if (text !== undefined) x.textContent = text; return x; };
function loadDesk() { try { const a = JSON.parse(localStorage.getItem(LS_DESK) || "[]"); return Array.isArray(a) ? a : []; } catch (e) { return []; } }
function storeDesk(a) { try { localStorage.setItem(LS_DESK, JSON.stringify(a)); return true; } catch (e) { return false; } }
function aiVerdictOf(items) { return items.length > 1 ? overallVerdict(items.map(i => i.r.verdict)).verdict : items[0].r.verdict; }
function urlsOf(items) {   // 판정에 쓴 근거 주소를 먼저, 나머지를 뒤에
  const used = [], rest = [];
  items.forEach(it => it.evidence.forEach((e, i) => {
    if (!/^https?:\/\//i.test(e.url)) return;
    ((it.r.used || []).includes(i + 1) ? used : rest).push(e.url);
  }));
  return [...new Set([...used, ...rest])];
}
function fmtTime(ts) { const d = new Date(ts), p = n => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; }
function vpill(v) { const s = el("span", "vp", v); s.style.background = VERDICT_COLOR[v] || "#5b6270"; return s; }

function buildDesk(ctx) {   // ctx: { claim, ai, urls, ts }
  const box = el("div", "desk");
  box.appendChild(el("div", "h3", "데스크 확정"));
  const fr = el("div", "fr");
  fr.append(el("span", "", "AI 판정: " + ctx.ai), el("span", "", "· 최종 판정"));
  const sel = el("select");
  sel.setAttribute("aria-label", "최종 판정");
  VERDICTS.forEach(v => { const o = el("option", "", v); o.value = v; sel.appendChild(o); });
  sel.value = ctx.ai;
  fr.appendChild(sel);
  const memo = el("textarea");
  memo.placeholder = "메모 (예: 확인한 자료, 판정을 바꾼 이유)";
  memo.setAttribute("aria-label", "메모");
  const save = el("button", "btn1", "기록에 저장");
  const msg = el("span", "dmsg");
  const ex = loadDesk().find(x => x.ts === ctx.ts && x.claim === ctx.claim);   // 이미 저장한 건이면 불러옴
  if (ex) { ctx.recId = ex.id; sel.value = ex.final; memo.value = ex.memo; save.textContent = "다시 저장"; msg.textContent = "저장된 기록입니다."; }
  save.onclick = () => {
    const rec = { id: ctx.recId || Date.now(), ts: ctx.ts, claim: ctx.claim, ai: ctx.ai, final: sel.value, memo: memo.value.trim(), urls: ctx.urls };
    let a = loadDesk();
    const i = a.findIndex(x => x.id === rec.id);
    if (i >= 0) a[i] = rec; else a.unshift(rec);
    if (a.length > 500) a = a.slice(0, 500);
    if (storeDesk(a)) { ctx.recId = rec.id; msg.textContent = "저장했습니다. 왼쪽 '검증 기록'에서 볼 수 있습니다."; save.textContent = "다시 저장"; }
    else msg.textContent = "저장하지 못했습니다. 브라우저 저장소가 막혀 있을 수 있습니다.";
  };
  const fr2 = el("div", "fr2"); fr2.append(save, msg);
  box.append(fr, memo, fr2);
  return box;
}
function mountDesk(claim, items, ts) {
  const box = $("deskBox"); box.textContent = "";
  box.appendChild(buildDesk({ claim, ai: aiVerdictOf(items), urls: urlsOf(items), ts }));
}

function renderHist() {
  const box = $("histList"); box.textContent = "";
  const a = loadDesk();
  if (a.length === 0) { box.appendChild(el("div", "empty", "아직 저장한 기록이 없습니다.")); return; }
  const wrap = el("div", "tblwrap"), tb = el("table", "rec");
  const trh = el("tr");
  ["주장", "AI 판정", "최종 판정", "메모", "근거 주소", "검증한 시각", ""].forEach(h => trh.appendChild(el("th", "", h)));
  tb.appendChild(el("thead")).appendChild(trh);
  const body = el("tbody");
  a.forEach(rec => {
    const tr = el("tr");
    tr.appendChild(el("td", "", rec.claim));
    const t2 = el("td"); t2.appendChild(vpill(rec.ai)); tr.appendChild(t2);
    const t3 = el("td"); t3.appendChild(vpill(rec.final)); if (rec.final !== rec.ai) t3.appendChild(el("span", "diff", "AI와 다름")); tr.appendChild(t3);
    tr.appendChild(el("td", "memo", rec.memo || ""));
    const t5 = el("td", "urls");
    (rec.urls || []).forEach(u => { if (/^https?:\/\//i.test(u)) { const l = el("a", "", u); l.href = u; l.target = "_blank"; l.rel = "noopener noreferrer"; t5.appendChild(l); } });
    tr.appendChild(t5);
    tr.appendChild(el("td", "time", fmtTime(rec.ts)));
    const t7 = el("td"); const d = el("button", "delbtn", "삭제");
    d.onclick = () => { if (confirm("이 기록을 지울까요?")) { storeDesk(loadDesk().filter(x => x.id !== rec.id)); renderHist(); } };
    t7.appendChild(d); tr.appendChild(t7);
    body.appendChild(tr);
  });
  tb.appendChild(body); wrap.appendChild(tb); box.appendChild(wrap);
}
$("histClear").onclick = () => { if (loadDesk().length && confirm("검증 기록을 모두 지울까요? 되돌릴 수 없습니다.")) { storeDesk([]); renderHist(); } };

// CSV: 맨 앞에 BOM(﻿)을 붙여야 엑셀에서 한글이 깨지지 않습니다. 셀 안 줄바꿈과 쌍따옴표는 규칙대로 감쌉니다.
function csvCell(v) {
  let s = String(v == null ? "" : v);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;   // 엑셀 수식으로 실행되는 것을 막음
  return '"' + s.replace(/"/g, '""') + '"';
}
function buildCsv(recs) {
  const head = ["주장", "AI 판정", "최종 판정", "메모", "근거 주소", "검증한 시각"];
  const rows = recs.map(r => [r.claim, r.ai, r.final, r.memo, (r.urls || []).join("\n"), fmtTime(r.ts)]);
  return "﻿" + [head, ...rows].map(r => r.map(csvCell).join(",")).join("\r\n") + "\r\n";
}
$("csvBtn").onclick = () => {
  const recs = loadDesk();
  if (recs.length === 0) { $("histMsg").textContent = "내려받을 기록이 없습니다."; return; }
  const d = new Date(), p = n => String(n).padStart(2, "0");
  const url = URL.createObjectURL(new Blob([buildCsv(recs)], { type: "text/csv;charset=utf-8" }));
  const a = el("a"); a.href = url; a.download = `검증기록_${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  $("histMsg").textContent = `${recs.length}건을 내려받았습니다.`;
};

// ===== 기사 점검 =====
const MAX_ART_CHARS = 12000, MAX_SENT = 150, MAX_CHECK = 30;
const KINDS = ["숫자", "날짜", "직함", "발언", "기타사실"];
const ART = { items: [] };

// 줄 단위로 나눈 뒤 문장 단위로 나눕니다. "3.5%"처럼 마침표 뒤에 공백이 없으면 나누지 않습니다.
function splitArticle(text) {
  let n = 0, cut = false;
  const lines = [];
  for (const line of text.replace(/\r\n?/g, "\n").split("\n")) {
    const l = line.trim(); if (!l) continue;
    const ids = [];
    for (const s of l.split(/(?<=[.!?。]["'”’)\]]*)\s+/)) {
      const t = s.trim(); if (!t) continue;
      if (n >= MAX_SENT) { cut = true; break; }
      ids.push({ id: ++n, text: t });
    }
    if (ids.length) lines.push(ids);
    if (cut) break;
  }
  return { lines, total: n, cut };
}
function buildExtractPrompt(sents) {
  return `당신은 기사 초고를 점검하는 팩트체크 보조자입니다. 아래는 기사 문장들이며 번호가 붙어 있습니다.
사실인지 확인할 수 있는 문장의 번호만 골라 주세요.
- 고를 문장: 숫자·통계·금액·비율, 날짜·기간, 직함·소속·인물의 지위, 누가 무엇을 말했다는 발언, 특정 사건이 일어났다는 서술.
- 뺄 문장: 의견, 전망, 평가, 주장·논평, 감상, 질문, 제목·소제목, 기자 이름·연락처·사진 설명, 확인할 사실이 없는 문장.
- 문장을 고쳐 쓰거나 새로 만들지 말고 번호만 답하세요. kind는 숫자, 날짜, 직함, 발언, 기타사실 중 하나입니다.
- 반드시 JSON으로만 답하세요: {"items":[{"id":1,"kind":"숫자"}]}

[문장]
${sents.map(s => s.id + ". " + s.text).join("\n")}`;
}
function parseExtract(text, max) {
  const obj = parseJsonLoose(text);
  const m = new Map();
  (Array.isArray(obj.items) ? obj.items : []).forEach(x => {
    const id = Number(x && x.id);
    if (Number.isInteger(id) && id >= 1 && id <= max && !m.has(id) && m.size < MAX_CHECK) m.set(id, KINDS.includes(x.kind) ? x.kind : "기타사실");
  });
  return m;
}

function artErr(t) { $("artErr").textContent = t || ""; }
function needKeys(which) {
  if (which.includes("t") && !$("tavilyKey").value.trim()) { artErr("Tavily 키를 입력해 주세요. (왼쪽 아래 설정)"); openSettings(); return false; }
  if (which.includes("c") && !$("claudeKey").value.trim()) { artErr("Claude 키를 입력해 주세요. (왼쪽 아래 설정)"); openSettings(); return false; }
  return true;
}

// 기사 주소 → 본문 (Tavily Extract)
$("artFetch").onclick = async () => {
  artErr(""); $("artMsg").textContent = "";
  const url = $("artUrl").value.trim();
  if (!/^https?:\/\/\S+$/i.test(url)) { artErr("http:// 또는 https:// 로 시작하는 기사 주소를 넣어 주세요."); return; }
  if (!needKeys("t")) return;
  const btn = $("artFetch"); btn.disabled = true; $("artMsg").textContent = "본문을 불러오는 중입니다...";
  try {
    let res;
    try {
      res = await fetch("https://api.tavily.com/extract", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + $("tavilyKey").value.trim() },
        body: JSON.stringify({ urls: [url] })
      });
    } catch (e) { throw new Error("Tavily에 연결하지 못했습니다. 인터넷 연결을 확인해 주세요."); }
    if (res.status === 401 || res.status === 403) throw new Error("Tavily 키가 올바르지 않거나 권한이 없습니다. (" + res.status + ")");
    if (res.status === 429) throw new Error("Tavily 사용 한도를 초과했습니다. (429)");
    if (!res.ok) throw new Error("본문을 불러오지 못했습니다. (" + res.status + ")");
    const data = await res.json();
    const body = data && Array.isArray(data.results) && data.results[0] && data.results[0].raw_content;
    if (!body) throw new Error("이 주소의 본문을 불러오지 못했습니다. 주소를 확인하거나 본문을 직접 붙여 넣어 주세요.");
    $("artText").value = String(body).trim();
    $("artMsg").textContent = `본문 ${$("artText").value.length.toLocaleString()}자를 불러왔습니다. 메뉴·광고 같은 군더더기가 섞였을 수 있으니 확인한 뒤 '확인할 문장 뽑기'를 누르세요.`;
  } catch (e) { $("artMsg").textContent = ""; artErr("오류: " + e.message); }
  finally { btn.disabled = false; }
};

// 확인할 문장 뽑기
$("artExtract").onclick = async () => {
  artErr(""); $("artMsg").textContent = "";
  const text = $("artText").value.trim();
  if (!text) { artErr("기사 초고나 보도자료를 붙여 넣어 주세요."); return; }
  if (!needKeys("c")) return;
  const btn = $("artExtract"); btn.disabled = true; $("artMsg").textContent = "확인할 문장을 고르는 중입니다...";
  try {
    const sp = splitArticle(text.slice(0, MAX_ART_CHARS));
    const flat = sp.lines.flat();
    if (flat.length === 0) throw new Error("문장을 찾지 못했습니다.");
    let kinds;
    try { kinds = parseExtract((await callClaude(buildExtractPrompt(flat), $("claudeKey").value.trim(), TOOL_EXTRACT)).text, flat.length); }
    catch (e) { if (e instanceof SyntaxError) throw new Error("Claude의 답을 해석하지 못했습니다. 다시 시도해 주세요."); throw e; }
    renderArticle(sp, kinds);
    let note = `전체 ${flat.length}문장 중 ${kinds.size}문장을 골랐습니다.`;
    if (sp.cut || text.length > MAX_ART_CHARS) note += ` 앞부분(${MAX_ART_CHARS.toLocaleString()}자·${MAX_SENT}문장)까지만 점검했습니다.`;
    if (kinds.size === 0) note = "확인할 수 있는 문장을 찾지 못했습니다. (모두 의견이거나 사실 확인이 필요 없는 문장)";
    $("artMsg").textContent = note;
  } catch (e) { $("artMsg").textContent = ""; artErr("오류: " + e.message); }
  finally { btn.disabled = false; }
};

function renderArticle(sp, kinds) {
  ART.items = [];
  const orig = $("artOrig"), list = $("artList");
  orig.textContent = ""; list.textContent = "";
  $("artWork").hidden = false;
  $("artLegend").textContent = "점선 밑줄 = 확인할 문장 · 검증하면 판정 색으로 칠해집니다";
  sp.lines.forEach(ids => {
    const p = el("div", "p");
    ids.forEach((s, i) => {
      const span = el("span", "s", s.text);
      if (kinds.has(s.id)) {
        span.classList.add("chk");
        const it = { id: s.id, text: s.text, kind: kinds.get(s.id), span };
        ART.items.push(it);
        span.onclick = () => { it.card.scrollIntoView({ behavior: "smooth", block: "center" }); it.card.classList.add("flash"); setTimeout(() => it.card.classList.remove("flash"), 1200); };
      }
      p.appendChild(span);
      if (i < ids.length - 1) p.appendChild(document.createTextNode(" "));
    });
    orig.appendChild(p);
  });
  $("artCount").textContent = `${ART.items.length}문장`;
  ART.items.forEach(it => {
    const card = el("div", "aitem"), top = el("div", "top"), txt = el("div", "txt");
    txt.append(el("span", "k", it.kind), document.createTextNode(it.text));
    const btn = el("button", "vb", "검증하기");
    top.append(txt, btn);
    it.ast = el("div", "ast"); it.res = el("div", "res"); it.desk = el("div");
    card.append(top, it.ast, it.res, it.desk);
    it.card = card; it.btn = btn;
    btn.onclick = () => verifySentence(it);
    list.appendChild(card);
  });
}

async function verifySentence(it) {
  artErr("");
  if (!needKeys("tc")) return;
  it.btn.disabled = true; it.ast.style.color = "";
  try {
    const { r, evidence } = await checkOne(it.text, $("tavilyKey").value.trim(), $("claudeKey").value.trim(), s => { it.ast.textContent = s; });
    it.res.textContent = ""; it.desk.textContent = "";
    renderPart(r, evidence, "", it.res);
    it.desk.appendChild(buildDesk({ claim: it.text, ai: r.verdict, urls: urlsOf([{ r, evidence }]), ts: Date.now() }));
    it.span.className = "s chk h-" + VERDICT_CLASS[r.verdict];   // 원문 문장에 판정 색을 칠함
    it.span.title = "판정: " + r.verdict;
    it.ast.textContent = "판정: " + r.verdict;
    it.btn.textContent = "다시 검증";
  } catch (e) {
    it.ast.textContent = "오류: " + (e && e.message ? e.message : "알 수 없는 오류가 발생했습니다.");
    it.ast.style.color = "var(--red)";
  } finally { it.btn.disabled = false; }
}

renderRecent();
autosize();
if (!lsGet(LS_TAVILY) || !lsGet(LS_CLAUDE)) openSettings();   // 키가 없으면 처음 열 때 설정 창을 띄움
</script>
</body>
</html>
